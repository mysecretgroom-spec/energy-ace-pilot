<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- App Info -->
    <title>DébalePro - Gestion commerciale ENR</title>
    <meta name="description" content="Application de gestion commerciale pour installateurs en énergies renouvelables. Planning, CRM, études et finances." />
    <meta name="author" content="DébalePro" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DébalePro" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="DébalePro" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-TileColor" content="#2563eb" />
    <meta name="msapplication-tap-highlight" content="no" />
    
    <!-- iOS Icons -->
    <link rel="apple-touch-icon" href="/pwa-icons/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/pwa-icons/icon-192x192.png" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/pwa-icons/icon-72x72.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/pwa-icons/icon-72x72.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    
    <!-- Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />
    
    <!-- Open Graph -->
    <meta property="og:title" content="DébalePro - Gestion commerciale ENR" />
    <meta property="og:description" content="Application de gestion commerciale pour installateurs en énergies renouvelables" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/pwa-icons/icon-512x512.png" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DébalePro" />
    <meta name="twitter:image" content="/pwa-icons/icon-512x512.png" />
    
    <!-- iOS Splash Screens -->
    <link rel="apple-touch-startup-image" href="/pwa-icons/icon-512x512.png" />
    
    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>

  <body>
    <div id="root">
      <!-- Fallback loading screen for PWA -->
      <style>
        @keyframes pwa-spin { to { transform: rotate(360deg); } }
        #pwa-loading {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: linear-gradient(135deg, #1e3a5f 0%, #0f172a 100%);
          z-index: 9999;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        #pwa-loading .spinner {
          width: 48px;
          height: 48px;
          border: 3px solid rgba(255,255,255,0.3);
          border-top-color: #3b82f6;
          border-radius: 50%;
          animation: pwa-spin 1s linear infinite;
          margin-bottom: 16px;
        }
        #pwa-loading p {
          color: rgba(255,255,255,0.8);
          font-size: 14px;
          margin: 0;
        }
        #pwa-loading .retry-btn {
          margin-top: 24px;
          padding: 12px 24px;
          background: #3b82f6;
          color: white;
          border: none;
          border-radius: 8px;
          font-size: 14px;
          cursor: pointer;
          display: none;
        }
      </style>
      <div id="pwa-loading">
        <div class="spinner"></div>
        <p>Chargement de DébalePro...</p>
        <button class="retry-btn" id="pwa-retry" onclick="window.pwaRetry()">Réessayer</button>
      </div>
    </div>
    <script>
      // PWA Cache recovery
      window.pwaRetry = function() {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            regs.forEach(function(r) { r.unregister(); });
          });
        }
        if ('caches' in window) {
          caches.keys().then(function(names) {
            Promise.all(names.map(function(n) { return caches.delete(n); })).then(function() {
              window.location.reload(true);
            });
          });
        } else {
          window.location.reload(true);
        }
      };
      
      // Show retry button after 5 seconds if app hasn't loaded
      setTimeout(function() {
        var btn = document.getElementById('pwa-retry');
        if (btn) btn.style.display = 'block';
      }, 5000);
      
      // Auto-retry after 15 seconds
      setTimeout(function() {
        var loading = document.getElementById('pwa-loading');
        if (loading && loading.parentNode) {
          var root = document.getElementById('root');
          if (root && root.querySelectorAll(':scope > *:not(style):not(#pwa-loading)').length === 0) {
            window.pwaRetry();
          }
        }
      }, 15000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
