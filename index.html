<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- App Info -->

    <meta name="description" content="Application de gestion commerciale pour installateurs en énergies renouvelables. Planning, CRM, études et finances." />
    <meta name="author" content="DébalePro" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DébalePro" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="DébalePro" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-TileColor" content="#2563eb" />
    <meta name="msapplication-tap-highlight" content="no" />
    
    <!-- iOS Icons -->
    <link rel="apple-touch-icon" href="/pwa-icons/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/pwa-icons/icon-192x192.png" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/pwa-icons/icon-72x72.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/pwa-icons/icon-72x72.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    
    <!-- Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />
    
    <!-- Open Graph -->
    <meta property="og:title" content="DébalePro - Gestion commerciale ENR" />
    <meta property="og:description" content="Application de gestion commerciale pour installateurs en énergies renouvelables" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/pwa-icons/icon-512x512.png" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DébalePro" />
    <meta name="twitter:image" content="/pwa-icons/icon-512x512.png" />
    
    <!-- iOS Splash Screens -->
    <link rel="apple-touch-startup-image" href="/pwa-icons/icon-512x512.png" />
    
    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>

  <body>
    <div id="root">
      <!-- Fallback loading screen for PWA -->
      <div id="pwa-loading" style="position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #1e3a5f 0%, #0f172a 100%); z-index: 9999;">
        <div style="text-align: center; color: white;">
          <div style="width: 48px; height: 48px; border: 3px solid rgba(255,255,255,0.3); border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px;"></div>
          <p style="font-family: system-ui, sans-serif; font-size: 14px; opacity: 0.8;">Chargement...</p>
        </div>
      </div>
      <style>
        @keyframes spin { to { transform: rotate(360deg); } }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Timeout fallback: if app doesn't load in 10s, try to recover
      setTimeout(function() {
        var loading = document.getElementById('pwa-loading');
        if (loading && loading.parentNode) {
          // Check if React has mounted
          var root = document.getElementById('root');
          if (root && root.children.length <= 2) {
            // App hasn't loaded, try clearing service worker cache
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(registrations) {
                registrations.forEach(function(registration) {
                  registration.unregister();
                });
                // Clear caches and reload
                if ('caches' in window) {
                  caches.keys().then(function(names) {
                    names.forEach(function(name) {
                      caches.delete(name);
                    });
                    window.location.reload();
                  });
                } else {
                  window.location.reload();
                }
              });
            } else {
              window.location.reload();
            }
          }
        }
      }, 10000);
    </script>
  </body>
</html>
